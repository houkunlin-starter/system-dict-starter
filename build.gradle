plugins {
    id 'org.jreleaser' version '1.22.0'
    // id 'maven-publish'
    // id 'signing'
    // id 'java-library'
    id 'application'
    id 'idea'
}

allprojects {
    group = 'com.houkunlin'
    version = '2.1.0'
    description = """
系统数据字典自动翻译成字典文本。可集合系统数据库中存储的用户数据字典，也可使用枚举做系统数据字典，主要用在返回数据给前端时自动把字典值翻译成字典文本信息；
implementation '${group}:system-dict-spring-boot2-starter:${version}' build by springboot 2.7.18 java 8.
implementation '${group}:system-dict-spring-boot3-starter:${version}' build by springboot 3.0.0 java 17.
implementation '${group}:system-dict-spring-boot4-starter:${version}' build by springboot 4.0.1 java 17.
The system data dictionary is automatically translated into dictionary text.
The user data dictionary stored in the system database can be aggregated, and the enumeration can also be used as the system data dictionary.
It is mainly used to automatically translate dictionary values into dictionary text information when returning data to the front end.
"""

    repositories {
        mavenCentral()
        maven {
            url = "https://repo1.maven.org/maven2"
        }
        mavenCentral()
        maven {
            url = "https://repo.spring.io/artifactory/libs-milestone-local/"
        }
        maven {
            url = "https://repo.spring.io/artifactory/libs-release-local/"
        }
    }

    def isSnapshot = findProperty("snapshot") != null || version.endsWith('SNAPSHOT')

    if (isSnapshot && !version.endsWith('SNAPSHOT')) {
        version += '-BUILD-SNAPSHOT'
    }

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    javadoc {
        enabled = true
        options.encoding = "UTF-8"
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    compileJava {
        options.encoding = "UTF-8"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

}
